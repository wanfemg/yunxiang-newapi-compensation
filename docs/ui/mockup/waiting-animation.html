<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云响 · 等待动画预览</title>
<style>
:root{color-scheme:dark;font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#edf5f1;background:#101618}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#243d342f,transparent 65%),#101618}main{width:min(650px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}header b{font-size:17px}header span{color:#96aaa1;font-size:12px}.card{position:relative;overflow:hidden;border:1px solid #ffffff18;border-radius:20px;background:#202b2780;backdrop-filter:blur(28px);padding:38px;box-shadow:0 24px 90px #0003;text-align:center}.visual{width:112px;height:112px;position:relative;margin:4px auto 26px;display:grid;place-items:center}.orbit{position:absolute;inset:0;border:1px solid #84d9bc25;border-radius:50%}.orbit:after{content:'';position:absolute;inset:-1px;border-radius:50%;border:2px solid transparent;border-top-color:#84d9bc;border-right-color:#84d9bc30;animation:rotate 1.6s linear infinite}.core{width:76px;height:76px;border-radius:22px;background:#84d9bc12;display:grid;place-items:center;color:#a4ebcf;box-shadow:0 0 36px #84d9bc10;animation:breathe 2s ease-in-out infinite}.core svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.check{display:none;stroke-dasharray:40;stroke-dashoffset:40}.success .check{display:block;animation:check .5s .1s ease forwards}.success .cloud{display:none}.success .orbit:after{animation:none;border-color:#84d9bc70}.success .core{animation:pop .4s ease-out;background:#84d9bc20}h1{font-size:23px;margin:0 0 10px;font-weight:550}p{color:#9bafa6;font-size:13px;line-height:1.8;margin:0;min-height:24px}.track{margin:27px 0 15px;height:3px;background:#ffffff0b;overflow:hidden;border-radius:8px}.beam{width:38%;height:100%;background:linear-gradient(90deg,transparent,#84d9bc,transparent);animation:scan 1.4s ease-in-out infinite}.success .beam{width:100%;animation:none;background:#84d9bc}.steps{display:flex;justify-content:space-between;gap:7px;font-size:11px;color:#73877e}.step{display:flex;align-items:center;gap:6px}.step i{width:7px;height:7px;border-radius:50%;background:#42524a}.step.active{color:#b4efd7}.step.active i{background:#84d9bc;box-shadow:0 0 0 4px #84d9bc14}.step.done{color:#93ad9f}.step.done i{background:#75b99e}.skeleton{margin-top:27px;border-top:1px solid #ffffff0c;padding-top:20px;display:grid;gap:11px}.skeleton div{height:9px;border-radius:5px;background:linear-gradient(100deg,#ffffff06 15%,#ffffff12 45%,#ffffff06 70%);background-size:250% 100%;animation:shimmer 1.6s linear infinite}.skeleton div:nth-child(2){width:76%}.skeleton div:nth-child(3){width:54%}.success .skeleton{display:none}.result{display:none;margin-top:20px;border-top:1px solid #ffffff12;padding-top:18px;color:#a5e6ca;font-size:25px;font-variant-numeric:tabular-nums}.success .result{display:block;animation:pop .4s ease-out}.result small{font-size:12px;color:#8ba899;display:block;margin-top:5px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}button{font:inherit;font-size:12px;color:#adbbb3;background:#1d2924;border:1px solid #ffffff16;border-radius:8px;padding:10px 15px;cursor:pointer;transition:background .18s,transform .18s}button:hover{background:#2b4035}button:active{transform:scale(.97)}button.primary{background:#84d9bc;color:#14291f;border-color:#84d9bc}button:focus-visible{outline:2px solid #b9efdb;outline-offset:3px}.note{text-align:center;font-size:11px;color:#70877b;margin-top:17px;line-height:1.8}.live{display:inline-block;width:6px;height:6px;background:#84d9bc;border-radius:50%;margin-right:5px;animation:breathe 1.6s infinite}
@keyframes rotate{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.55;transform:scale(.96)}}@keyframes scan{from{transform:translateX(-110%)}to{transform:translateX(370%)}}@keyframes shimmer{to{background-position:-150% 0}}@keyframes check{to{stroke-dashoffset:0}}@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@media(max-width:480px){body{padding:18px}.card{padding:30px 20px}.steps{font-size:10px}.step{gap:4px}header span{font-size:10px}h1{font-size:20px}}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}.check{stroke-dashoffset:0}.beam{width:100%;opacity:.5}}
</style><link rel="stylesheet" href="preview-theme.css"><link rel="stylesheet" href="preview-refinement.css"><script src="preview-theme.js" defer></script>
<main><header><b>☁ 云响 · 动效预览</b><span>独立演示 · 不发起真实补偿</span></header><section class="card" aria-busy="true"><div class="visual"><div class="orbit"></div><div class="core"><svg class="cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.4-8 5.5 5.5 0 0 1 10.6-1.2A4.5 4.5 0 1 1 18 18Z"/><path d="M9 14h6m-4-2-2 2 2 2"/></svg><svg class="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div></div><div role="status" aria-live="polite"><h1 id="title">正在查询消费日志</h1><p id="description">正在同步最近消费记录，请稍候…</p></div><div class="track"><div class="beam"></div></div><div class="steps"><span class="step"><i></i>日志查询</span><span class="step"><i></i>空回核验</span><span class="step"><i></i>自动审批</span><span class="step"><i></i>到账确认</span></div><div class="skeleton" aria-hidden="true"><div></div><div></div><div></div></div><div class="result">+ 42.00 额度<small>演示到账结果 · 额度返还至钱包余额</small></div></section><div class="controls"><button class="primary" id="play">▶ 播放完整流程</button><button data-stage="0">查询等待</button><button data-stage="1">核验等待</button><button data-stage="2">审批等待</button><button data-stage="3">成功动画</button></div><div class="note"><span class="live"></span>旋转光环 · 呼吸云标 · 流动光带 · 骨架屏 · 成功勾选<br>演示每阶段停留约 2.8 秒；实际接入时由接口结果驱动，不显示虚假百分比。</div></main>
<script>
const stages=[['正在查询消费日志','正在同步最近消费记录，请稍候…'],['正在核验空回记录','核对模型、扣费记录及重复补偿状态…'],['正在自动审批','正在校验补偿规则与今日剩余额度…'],['补额度成功','已确认钱包到账，补偿记录已更新。']];let timer;function show(i){document.querySelector('.card').classList.toggle('success',i===3);document.querySelector('.card').setAttribute('aria-busy',String(i!==3));document.querySelector('#title').textContent=stages[i][0];document.querySelector('#description').textContent=stages[i][1];document.querySelectorAll('.step').forEach((el,n)=>{el.classList.toggle('active',n===i);el.classList.toggle('done',n<i)})}function play(){clearTimeout(timer);let i=0;show(i);function next(){timer=setTimeout(()=>{show(++i);if(i<3)next()},2800)}next()}document.querySelector('#play').onclick=play;document.querySelectorAll('[data-stage]').forEach(button=>button.onclick=()=>{clearTimeout(timer);show(Number(button.dataset.stage))});play();
</script></html>
